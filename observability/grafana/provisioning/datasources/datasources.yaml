# Picked up by the kube-prometheus-stack Grafana sidecar
# (grafana.sidecar.datasources.label=grafana_datasource) when wrapped in a
# ConfigMap with that label, or mounted directly if running Grafana standalone.
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus-kube-prometheus-prometheus.observability.svc.cluster.local:9090
    isDefault: true
    editable: false

  - name: Loki
    type: loki
    access: proxy
    url: http://loki-gateway.observability.svc.cluster.local
    editable: false
    jsonData:
      derivedFields:
        - datasourceUid: tempo
          matcherRegex: 'trace_id=(\w+)'
          name: TraceID
          url: "$${__value.raw}"
