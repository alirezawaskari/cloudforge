## Values for open-telemetry/opentelemetry-collector chart (mode: deployment).
## Pass the pipeline config from otel-collector-config.yaml with:
##   helm install otel-collector open-telemetry/opentelemetry-collector \
##     -f observability/otel/otel-collector-values.yaml \
##     --set-file config=observability/otel/otel-collector-config.yaml \
##     -n observability

mode: deployment
replicaCount: 1

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

ports:
  otlp:
    enabled: true
    containerPort: 4317
    servicePort: 4317
    protocol: TCP
  otlp-http:
    enabled: true
    containerPort: 4318
    servicePort: 4318
    protocol: TCP
