apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cloudforge-alerts
  labels:
    release: prometheus
spec:
  groups:
    - name: cloudforge.rules
      rules:
        - alert: CloudforgeHighErrorRate
          expr: |
            sum(rate(http_requests_total{route!="unmatched",status=~"5.."}[5m]))
              /
            sum(rate(http_requests_total{route!="unmatched"}[5m]))
              > 0.05
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "cloudforge API 5xx error rate above 5%"
            description: "Error rate has been above 5% for 5 minutes. Check recent deploys and dependency health."

        - alert: CloudforgeHighLatencyP99
          expr: |
            histogram_quantile(0.99,
              sum(rate(http_request_duration_seconds_bucket[5m])) by (le)
            ) > 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "cloudforge API p99 latency above 1s"
            description: "p99 request latency has exceeded 1s for 10 minutes."

        - alert: CloudforgePodCrashLooping
          expr: |
            increase(kube_pod_container_status_restarts_total{pod=~"cloudforge-.*"}[15m]) > 3
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "cloudforge pod restarting repeatedly"
            description: "{{ $labels.pod }} has restarted more than 3 times in 15 minutes."

        - alert: CloudforgeHPAMaxedOut
          expr: |
            kube_horizontalpodautoscaler_status_current_replicas{horizontalpodautoscaler="cloudforge"}
              >= kube_horizontalpodautoscaler_spec_max_replicas{horizontalpodautoscaler="cloudforge"}
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "cloudforge HPA at max replicas"
            description: "Autoscaler has been pinned at maxReplicas for 15 minutes — consider raising the ceiling or investigating load."

        - alert: CloudforgePodNotReady
          expr: |
            sum(kube_pod_status_ready{condition="true", pod=~"cloudforge-.*"}) < 1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "No ready cloudforge pods"
            description: "Zero cloudforge pods have reported ready for 5 minutes."
