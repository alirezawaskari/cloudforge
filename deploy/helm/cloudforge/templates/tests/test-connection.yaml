apiVersion: v1
kind: Pod
metadata:
  name: {{ include "cloudforge.fullname" . }}-test-connection
  labels:
    {{- include "cloudforge.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  containers:
    - name: wget
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          wget -qO- --timeout=5 http://{{ include "cloudforge.fullname" . }}:{{ .Values.service.port }}/livez &&
          wget -qO- --timeout=5 http://{{ include "cloudforge.fullname" . }}:{{ .Values.service.port }}/readyz
  restartPolicy: Never
